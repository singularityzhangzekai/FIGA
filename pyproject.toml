[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invisible-grocery"
version = "0.1.0"
description = "Camera-driven grocery agent with DeepSeek, Markdown preferences, and voice interaction"
requires-python = ">=3.10"
dependencies = ["certifi>=2024.2.2"]

[project.scripts]
grocery = "grocery.__main__:main"

[tool.setuptools.packages.find]
include = ["grocery*"]
